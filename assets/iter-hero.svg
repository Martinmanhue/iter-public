<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Iter — Aprende una vez. Usa cualquier biblioteca.</title>
  <desc id="desc">Portada técnica de la vista previa pública de Iter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="0.55" stop-color="#0b2036"/>
      <stop offset="1" stop-color="#0d2b34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74c0fc"/>
      <stop offset="1" stop-color="#8ce99a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="200" fill="#74c0fc" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1110" cy="530" r="210" fill="#8ce99a" opacity="0.12" filter="url(#glow)"/>

  <g transform="translate(72 78)">
    <rect width="78" height="78" rx="22" fill="#102840" stroke="#74c0fc" stroke-width="2"/>
    <text x="39" y="54" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="44" font-weight="800" fill="#f4f7fb">I</text>
    <text x="101" y="54" font-family="Inter,Segoe UI,sans-serif" font-size="48" font-weight="800" fill="#f4f7fb">Iter</text>

    <rect x="0" y="120" width="328" height="42" rx="21" fill="#132b45" stroke="#284b6d"/>
    <text x="164" y="147" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#b9dfff">Vista previa pública · 0.3.0-rc.2</text>

    <text x="0" y="255" font-family="Inter,Segoe UI,sans-serif" font-size="62" font-weight="800" fill="#f4f7fb">Aprende una vez.</text>
    <text x="0" y="328" font-family="Inter,Segoe UI,sans-serif" font-size="62" font-weight="800" fill="url(#accent)">Usa cualquier biblioteca.</text>
    <text x="0" y="390" font-family="Inter,Segoe UI,sans-serif" font-size="24" fill="#a8b6ca">La intención primero. Iter coordina el resto.</text>
    <text x="0" y="455" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#8ce99a">Everything is a Resource.</text>
  </g>

  <g transform="translate(735 155)">
    <rect width="470" height="318" rx="24" fill="#06111d" stroke="#28435f" stroke-width="2"/>
    <circle cx="28" cy="26" r="6" fill="#ff6b6b"/>
    <circle cx="50" cy="26" r="6" fill="#ffd43b"/>
    <circle cx="72" cy="26" r="6" fill="#69db7c"/>

    <text x="32" y="105" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#f4f7fb">iter convert</text>
    <text x="191" y="105" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#8ce99a">data.json</text>
    <text x="310" y="105" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#f4f7fb">to</text>
    <text x="349" y="105" font-family="SFMono-Regular,Consolas,monospace" font-size="22" fill="#74c0fc">data.csv</text>

    <line x1="32" y1="155" x2="438" y2="155" stroke="#203852"/>
    <text x="32" y="205" font-family="SFMono-Regular,Consolas,monospace" font-size="18" fill="#8ce99a">✓ una intención</text>
    <text x="252" y="205" font-family="SFMono-Regular,Consolas,monospace" font-size="18" fill="#8ce99a">✓ una instrucción</text>
    <text x="32" y="250" font-family="SFMono-Regular,Consolas,monospace" font-size="18" fill="#8ce99a">✓ sin imports visibles</text>
    <text x="32" y="288" font-family="SFMono-Regular,Consolas,monospace" font-size="16" fill="#73869b">preview · not yet installable</text>
  </g>
</svg>