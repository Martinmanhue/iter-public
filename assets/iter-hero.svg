<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Iter — Aprende una vez. Usa cualquier biblioteca.</title>
  <desc id="desc">Portada pública de Iter con una composición de convergencia visual y mensaje principal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcfd"/>
      <stop offset="65%" stop-color="#f7f7f4"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
    <linearGradient id="tealOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17c6d2"/>
      <stop offset="55%" stop-color="#5fd2b4"/>
      <stop offset="100%" stop-color="#f6a400"/>
    </linearGradient>
    <linearGradient id="tealOnly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#17c6d2"/>
      <stop offset="100%" stop-color="#0e9db7"/>
    </linearGradient>
    <linearGradient id="orangeOnly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffbf3f"/>
      <stop offset="100%" stop-color="#f39b00"/>
    </linearGradient>
    <linearGradient id="darkPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b29"/>
      <stop offset="100%" stop-color="#162536"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="0" cy="0.45" r="0.9">
      <stop offset="0%" stop-color="#17c6d2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#17c6d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="1" cy="0.5" r="0.8">
      <stop offset="0%" stop-color="#f6a400" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#f6a400" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0d1b2a" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#leftGlow)"/>
  <rect width="1600" height="900" fill="url(#rightGlow)"/>

  <g opacity="0.8">
    <path d="M34 130 L34 370" stroke="#cfd7dd" stroke-width="2"/>
    <circle cx="34" cy="52" r="5" fill="#17c6d2"/>
    <rect x="30" y="75" width="8" height="8" fill="#f39b00"/>
    <circle cx="34" cy="100" r="4" fill="#9fd6d3"/>
    <rect x="30" y="122" width="8" height="8" fill="#404d5c"/>
    <text x="20" y="725" transform="rotate(-90 20 725)" class="sans" font-size="18" letter-spacing="6" fill="#243546">UNIFY. CONNECT. <tspan fill="#f39b00">EMPOWER.</tspan></text>
    <text x="22" y="838" class="serif" font-size="68" fill="url(#tealOrange)">I</text>
    <line x1="18" y1="858" x2="56" y2="858" stroke="#aab4bf" stroke-width="2"/>
  </g>

  <g transform="translate(130 220)" filter="url(#softShadow)">
    <path d="M90 0 H310 C286 0 273 15 262 39 C229 110 194 157 102 230 C195 300 229 347 262 420 C273 444 286 460 310 460 H90 C118 460 132 448 145 425 C180 357 214 304 329 230 C214 156 180 103 145 35 C132 12 118 0 90 0 Z" fill="url(#tealOrange)"/>
    <path d="M0 0 H90 V460 H0 C24 460 38 448 48 430 C82 364 114 307 221 230 C114 153 82 96 48 30 C38 12 24 0 0 0 Z" fill="#14bed4" opacity="0.96"/>
    <path d="M310 0 H400 C376 0 362 12 352 30 C318 96 286 153 179 230 C286 307 318 364 352 430 C362 448 376 460 400 460 H310 Z" fill="#f5a400" opacity="0.96"/>
    <path d="M208 72 L292 72 L248 120 L308 120 L308 170 L236 170 L236 226 L312 226 L312 276 L236 276 L236 334 L316 334 L316 385 L234 385 L190 340 L190 166 Z" fill="#0d1b2a" opacity="0.9"/>
  </g>

  <g transform="translate(500 180)">
    <g fill="none" stroke-width="2.5">
      <path d="M0 50 C160 50 120 270 290 270" stroke="#17c6d2"/>
      <path d="M0 92 C145 92 118 270 290 270" stroke="#59cfc3"/>
      <path d="M0 134 C132 134 112 270 290 270" stroke="#5ecad0"/>
      <path d="M0 176 C120 176 105 270 290 270" stroke="#9db6c3"/>
      <path d="M0 218 C108 218 98 270 290 270" stroke="#6b7d8f"/>
      <path d="M0 260 C115 260 100 270 290 270" stroke="#f0a11d"/>
      <path d="M0 302 C128 302 110 270 290 270" stroke="#efaa3a"/>
      <path d="M0 344 C142 344 118 270 290 270" stroke="#f2b452"/>
      <path d="M0 386 C160 386 125 270 290 270" stroke="#f2ba68"/>
    </g>
    <g fill="#17c6d2" stroke="#17c6d2" stroke-width="2">
      <circle cx="0" cy="50" r="7"/>
      <path d="M0 84 l8 8 l-8 8 l-8 -8 z" fill="none"/>
      <rect x="-8" y="126" width="16" height="16" fill="none"/>
      <polygon points="0,168 8,176 0,184 -8,176" fill="none"/>
    </g>
    <g fill="none" stroke="#606f7f" stroke-width="2">
      <polygon points="0,210 8,224 -8,224"/>
      <circle cx="0" cy="260" r="7" fill="#606f7f" stroke="none"/>
    </g>
    <g fill="none" stroke="#f39b00" stroke-width="2">
      <circle cx="0" cy="302" r="8"/>
      <rect x="-8" y="336" width="16" height="16"/>
      <path d="M0 378 l8 8 l-8 8 l-8 -8 z"/>
      <polygon points="0,420 8,428 0,436 -8,428" opacity="0"/>
    </g>
    <circle cx="290" cy="270" r="12" fill="#fff" stroke="#17c6d2" stroke-width="4"/>
    <circle cx="290" cy="270" r="5" fill="#f39b00"/>
    <line x1="302" y1="270" x2="865" y2="270" stroke="url(#tealOrange)" stroke-width="2.5"/>
  </g>

  <g transform="translate(815 120)">
    <text x="0" y="0" class="sans" font-size="80" font-weight="700" fill="#17c6d2">I</text>
    <text x="98" y="0" class="sans" font-size="80" font-weight="700" fill="#1d2b39">T</text>
    <rect x="220" y="-62" width="74" height="12" rx="6" fill="url(#tealOrange)"/>
    <rect x="220" y="-34" width="74" height="12" rx="6" fill="url(#tealOrange)"/>
    <rect x="220" y="-6" width="74" height="12" rx="6" fill="url(#tealOrange)"/>
    <text x="365" y="0" class="sans" font-size="80" font-weight="700" fill="#1d2b39">R</text>

    <text x="0" y="150" class="serif" font-size="80" fill="#172634">Aprende una vez.</text>
    <text x="0" y="248" class="serif" font-size="86" fill="#172634">Usa <tspan fill="url(#tealOrange)">cualquier</tspan> biblioteca.</text>

    <text x="5" y="360" class="sans" font-size="25" font-weight="600" letter-spacing="7" fill="#17aebb">EVERYTHING</text>
    <text x="284" y="360" class="sans" font-size="25" font-weight="500" letter-spacing="7" fill="#172634">IS A</text>
    <text x="420" y="360" class="sans" font-size="25" font-weight="600" letter-spacing="7" fill="#ef9f14">RESOURCE.</text>

    <g transform="translate(0 420)" filter="url(#softShadow)">
      <rect width="520" height="78" rx="12" fill="url(#darkPanel)"/>
      <text x="30" y="50" class="mono" font-size="28" fill="#17c6d2">iter</text>
      <text x="102" y="50" class="mono" font-size="28" fill="#f0a11d">convert</text>
      <text x="244" y="50" class="mono" font-size="28" fill="#eff6fb">data.json to data.csv</text>
    </g>

    <g transform="translate(0 565)">
      <line x1="0" y1="0" x2="0" y2="75" stroke="url(#tealOrange)" stroke-width="3"/>
      <text x="22" y="28" class="sans" font-size="28" fill="#243546">Una experiencia común para trabajar con</text>
      <text x="22" y="68" class="sans" font-size="28" fill="#243546">recursos, formatos, bibliotecas y backends.</text>
    </g>
  </g>

  <g transform="translate(815 790)">
    <g>
      <circle cx="18" cy="0" r="14" fill="none" stroke="#17aebb" stroke-width="2.5"/>
      <path d="M18 -14 A14 14 0 0 1 18 14 M4 0 H32 M18 -14 A16 16 0 0 0 18 14" fill="none" stroke="#17aebb" stroke-width="2"/>
      <text x="58" y="9" class="sans" font-size="24" letter-spacing="5" fill="#17aebb">VISTA PREVIA PÚBLICA</text>
    </g>
    <line x1="445" y1="-24" x2="445" y2="24" stroke="#d0d7de" stroke-width="2"/>
    <g transform="translate(490 0)">
      <circle cx="0" cy="0" r="4" fill="#ef9f14"/>
      <circle cx="0" cy="-18" r="4" fill="#ef9f14"/>
      <circle cx="18" cy="-9" r="4" fill="#ef9f14"/>
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#ef9f14" stroke-width="2"/>
      <line x1="0" y1="-18" x2="18" y2="-9" stroke="#ef9f14" stroke-width="2"/>
      <line x1="0" y1="0" x2="18" y2="-9" stroke="#ef9f14" stroke-width="2"/>
      <text x="42" y="9" class="sans" font-size="24" letter-spacing="5" fill="#ef9f14">REPOSITORIO PÚBLICO</text>
    </g>
  </g>

  <g opacity="0.45" fill="none" stroke-width="2">
    <path d="M1360 130 C1480 180 1540 295 1552 410" stroke="#f5d4a1"/>
    <path d="M1340 160 C1450 210 1510 318 1520 430" stroke="#f1d2a7"/>
    <path d="M1318 190 C1420 240 1480 340 1492 450" stroke="#ecd0b0"/>
    <path d="M126 760 C210 730 270 736 335 790" stroke="#b9edf1"/>
    <path d="M104 790 C190 760 250 766 314 820" stroke="#d1f5f5"/>
    <path d="M82 820 C170 792 230 798 294 850" stroke="#e5faf7"/>
  </g>
</svg>
