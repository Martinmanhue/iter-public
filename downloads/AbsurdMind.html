<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AbsurdMind</title><style>body{margin:0;background:#0d1016;color:#f5f7fb;font-family:system-ui;padding:18px}.app{max-width:900px;margin:auto}.card{background:#171b24;border:1px solid #2a3140;border-radius:18px;padding:18px;margin:12px 0}h1{font-size:clamp(2rem,7vw,4rem);line-height:1;margin:.3em 0}p{color:#b4bbca;line-height:1.5}select,textarea,button{font:inherit}select,textarea{width:100%;background:#0f131a;color:#fff;border:1px solid #303848;border-radius:12px;padding:11px;margin:6px 0 12px}textarea{min-height:180px;box-sizing:border-box}button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:#9b86ff;color:#111;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.idea{background:#10141b;border:1px solid #2b3240;border-radius:14px;padding:14px}.emoji{font-size:2.5rem}.muted{color:#9fa8b8;font-size:.85rem}.hidden{display:none}.timer{font-size:1.4rem;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="card"><b>AbsurdMind · Adaptive</b><h1>Aprende lo difícil con asociaciones absurdas.</h1><p>Sesiones personalizadas de hasta 30 minutos para niños, adolescentes y adultos.</p></div><div class="card"><label>Edad</label><select id="age"><option>6–9 años</option><option>10–12 años</option><option selected>13–17 años</option><option>Adulto</option></select><label>Objetivo</label><select id="goal"><option>Memorizar</option><option selected>Entender y recordar</option><option>Preparar examen</option><option>Explicarlo</option></select><label>Tiempo</label><select id="mins"><option>10</option><option>15</option><option>20</option><option>25</option><option selected>30</option></select><label>Contenido</label><textarea id="src" placeholder="Pega aquí apuntes, definiciones, una lista o un tema largo..."></textarea><button id="go">Crear sesión</button></div><div id="session" class="hidden"><div class="card"><div class="timer">⏱ <span id="time">30:00</span></div><p id="coach"></p><button id="start">Iniciar cronómetro</button></div><div class="card"><h2>Historia visual</h2><div id="ideas" class="grid"></div></div><div class="card"><h2>Recuperación activa</h2><div id="recall"></div></div></div></main><script>const $=s=>document.querySelector(s);let cards=[],i=0,timer=null,secs=1800;const chars={'6–9 años':85,'10–12 años':115,'13–17 años':155,'Adulto':190},maxi={'6–9 años':6,'10–12 años':8,'13–17 años':10,'Adulto':12};const animals=['🐘','🦖','🐙','🦄','🤖','🐸'],places=['🌋','🚀','🎡','🏰','🛸','🌊'],acts=['explota en confeti','se convierte en gelatina','sale disparado por un cañón','empieza a bailar','se infla como un globo','se congela'];function words(t){let stop=new Set('para como desde hasta entre sobre esta este estos estas unos unas pero porque cuando donde quien tiene tienen está están fueron'.split(' '));let f={};t.toLowerCase().replace(/[^a-záéíóúüñ0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>4&&!stop.has(x)).forEach(x=>f[x]=(f[x]||0)+1);return Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0])}function split(t,n,m){let a=t.replace(/\r/g,'').split(/(?<=[.!?;:])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>7),o=[],c='';for(let s of a){if(!c)c=s;else if((c+' '+s).length<=n)c+=' '+s;else{o.push(c);c=s}}if(c)o.push(c);return o.slice(0,m)}function make(t,k){let w=words(t),e=animals[k%animals.length]+places[(k*2)%places.length],cue=(w[0]||'IDEA').toUpperCase(),scene=`Imagina ${animals[k%animals.length]} que ${acts[k%acts.length]} con las palabras “${w.join(', ')||'idea principal'}” dentro de ${places[(k*2)%places.length]}. Hazlo gigante, ruidoso y ridículo.`;return{text:t,cue,scene,e,str:0}}function render(){let g=$('#ideas');g.innerHTML='';cards.forEach((c,k)=>{let d=document.createElement('div');d.className='idea';d.innerHTML=`<div class=muted>IDEA ${k+1}</div><div class=emoji>${c.e}</div><b>${c.cue}</b><p>${c.scene}</p><details><summary>Ver idea</summary><p>${c.text}</p></details>`;g.appendChild(d)});recall()}function recall(){if(!cards.length)return;let c=cards[i%cards.length];$('#recall').innerHTML=`<div class=emoji>${c.e}</div><h3>${c.cue}</h3><p>${c.scene}</p><button id=r>Mostrar respuesta</button><div id=a class=hidden><p>${c.text}</p><button onclick="rate(0)">No la recordé</button> <button onclick="rate(1)">Casi</button> <button onclick="rate(2)">Sí</button></div>`;$('#r').onclick=()=>{$('#a').classList.remove('hidden');$('#r').classList.add('hidden')}}window.rate=q=>{cards[i%cards.length].str+=q===2?1:0;i=(i+1)%cards.length;recall()};function clock(){let m=Math.floor(secs/60),s=secs%60;$('#time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}$('#go').onclick=()=>{let t=$('#src').value.trim();if(!t)return;let age=$('#age').value;cards=split(t,chars[age],maxi[age]).map(make);secs=Number($('#mins').value)*60;clock();$('#session').classList.remove('hidden');$('#coach').textContent=`Perfil: ${age}. Objetivo: ${$('#goal').value}. He creado ${cards.length} ideas manejables. Si el material es enorme, prioriza lo esencial en esta sesión y continúa en otra.`;render();$('#session').scrollIntoView({behavior:'smooth'})};$('#start').onclick=()=>{clearInterval(timer);secs=Number($('#mins').value)*60;clock();timer=setInterval(()=>{secs--;clock();if(secs<=0)clearInterval(timer)},1000)}</script></body></html>
