<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0a">
<meta name="mobile-web-app-capable" content="yes">
<title>Grafito</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <div id="field"></div>
  <main id="center">
    <div id="reply"></div>
    <input id="entry" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="Escribe…">
  </main>
</div>
<div id="lock">
  <div id="lockbox">
    <div class="brand">Grafito</div>
    <input id="key" type="password" autocomplete="current-password" placeholder="Clave privada">
    <button id="unlock">Entrar</button>
    <div id="err"></div>
    <div class="small">La clave no se guarda. El estado de Grafito se cifra localmente en este navegador.</div>
  </div>
</div>
<script src="./grafito-v6.js?v=6"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) { if (r.scope.includes('/iter-public/')) await r.update().catch(() => {}); }
        const r = await navigator.serviceWorker.register('./sw.js?v=6', { scope: './', updateViaCache: 'none' });
        r.update().catch(() => {});
      } catch (_) {}
    });
  }
  document.addEventListener('click', event => {
    if (event.target && event.target.id === 'unlock') navigator.storage?.persist?.().catch?.(() => {});
  }, { passive: true });
</script>
</body>
</html>
