<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0a">
<meta name="mobile-web-app-capable" content="yes">
<title>Grafito</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css?v=15">
</head>
<body>
<div id="app">
  <div id="field"></div>
  <main id="center">
    <div id="reply"></div>
    <input id="entry" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="Escribe…">
  </main>
</div>
<div id="lock">
  <div id="lockbox">
    <div class="brand">Grafito</div>
    <input id="key" type="password" autocomplete="current-password" placeholder="Clave privada">
    <button id="unlock">Entrar</button>
    <div id="err"></div>
    <div class="small">La clave no se guarda. El estado de Grafito se cifra localmente en este navegador.</div>
  </div>
</div>
<script src="./grafito-v7.js?v=15-base"></script>
<script src="./grafito-v9-patch.js?v=15-knowledge"></script>
<script src="./grafito-v10-patch.js?v=15-intent"></script>
<script src="./grafito-v11-patch.js?v=15-general"></script>
<script src="./grafito-v12-patch.js?v=15-synthesis"></script>
<script src="./grafito-v13-patch.js?v=15-capabilities"></script>
<script src="./grafito-v14-patch.js?v=15-reason-action"></script>
<script src="./grafito-v15-patch.js?v=15-self-autonomy"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) { if (r.scope.includes('/iter-public/')) await r.update().catch(() => {}); }
        const r = await navigator.serviceWorker.register('./sw.js?v=15', { scope: './', updateViaCache: 'none' });
        r.update().catch(() => {});
      } catch (_) {}
    });
  }
  document.addEventListener('click', event => {
    if (event.target && event.target.id === 'unlock') navigator.storage?.persist?.().catch?.(() => {});
  }, { passive: true });
</script>
</body>
</html>
